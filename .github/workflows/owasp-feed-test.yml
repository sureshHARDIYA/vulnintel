name: OWASP public data test
on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate official OWASP ASVS CSV
        run: |
          python3 - <<'PY'
          import csv, io, urllib.request
          url="https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.csv"
          request=urllib.request.Request(url,headers={"User-Agent":"VulnIntel-OWASP-Smoke/0.1"})
          with urllib.request.urlopen(request,timeout=30) as response:
              rows=list(csv.DictReader(io.StringIO(response.read().decode("utf-8-sig"))))
          if not rows or not {"req_id","req_description"}.issubset(rows[0]):
              raise RuntimeError("Unexpected OWASP ASVS CSV structure")
          print(f"OWASP ASVS 5.0: OK, {len(rows)} requirements")
          PY
