name: Generate public vulnerability snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Export public feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/export_public_feed.py
      - uses: actions/upload-artifact@v4
        with:
          name: vulnintel-public-feed
          path: public-feed/vulnerabilities.json
          retention-days: 7
      - name: Update public-feed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp public-feed/vulnerabilities.json /tmp/vulnerabilities.json
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin public-feed; then
            git checkout -B public-feed origin/public-feed
          else
            git checkout --orphan public-feed
            git rm -rf --cached . >/dev/null
          fi
          mkdir -p public-feed
          cp /tmp/vulnerabilities.json public-feed/vulnerabilities.json
          git add public-feed/vulnerabilities.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh vulnerability snapshot"
            git push origin HEAD:public-feed
          fi
