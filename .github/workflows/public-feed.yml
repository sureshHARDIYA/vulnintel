name: Generate public vulnerability snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Export public feed
        run: python3 scripts/export_public_feed.py
      - uses: actions/upload-artifact@v4
        with:
          name: vulnintel-public-feed
          path: public-feed/vulnerabilities.json
          retention-days: 7
