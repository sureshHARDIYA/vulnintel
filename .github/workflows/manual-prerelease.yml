name: Manual GitHub prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New prerelease tag (for example v0.1.1-rc.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prerelease-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || { echo "Expected vMAJOR.MINOR.PATCH-rc.N"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo package -p vulnintel-core --allow-dirty
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag already exists: $TAG"
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "VulnIntel $TAG" --generate-notes --prerelease --verify-tag=false
